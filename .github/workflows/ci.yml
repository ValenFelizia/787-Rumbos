# CI = Continuous Integration: en cada push/PR, una máquina de GitHub
# corre los mismos chequeos que deberían pasar antes de mergear.
#
# Qué hace este workflow (en orden):
# 1. Instala dependencias
# 2. Lint (ESLint) + typecheck (TypeScript) + build (Next.js)
# 3. Smoke tests E2E (Playwright) contra el build de producción

name: CI

on:
  push:
    branches: [development, master, main]
  pull_request:
    branches: [development, master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, build & smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build:e2e

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke tests (E2E)
        run: npm run test:e2e:ci
