# CI = Continuous Integration: en cada push/PR, una máquina de GitHub
# corre los mismos chequeos que deberían pasar antes de mergear.
#
# Qué hace este workflow (en orden):
# 1. Instala dependencias
# 2. Levanta Postgres, aplica migraciones y carga el catálogo
# 3. Lint (ESLint) + typecheck (TypeScript) + paridad del catálogo
# 4. Build (Next.js) y smoke tests E2E (Playwright)

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, build & smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rumbos
          POSTGRES_PASSWORD: rumbos
          POSTGRES_DB: rumbos_cms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rumbos -d rumbos_cms"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URI: postgres://rumbos:rumbos@localhost:5432/rumbos_cms
      PAYLOAD_SECRET: ci-payload-secret-not-for-production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migrate database
        run: npm run cms:migrate

      - name: Seed catalog
        run: npm run cms:seed

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Catalog parity
        run: npm run test:parity

      - name: Build
        run: npm run build:e2e

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke tests (E2E)
        run: npm run test:e2e:ci
